<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Renombrado Manual — Zilo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fcfcfc; color: #2c3e50; overflow: hidden;
        }
        body.dark-mode { background: #1e1e1e; color: #e0e0e0; }

        .container {
            display: flex; flex-direction: column; height: 100vh;
            padding: 16px 16px 10px; gap: 12px;
        }

        /* ── Cabecera ── */
        .header {
            display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }
        .header h2 { font-size: 1.3rem; color: #2c3e50; flex: 1; }
        body.dark-mode .header h2 { color: #e0e0e0; }
        .queue-badge {
            background: #3498db; color: white;
            padding: 3px 12px; border-radius: 12px; font-size: .82rem; font-weight: 700;
        }

        /* ── Cuerpo principal ── */
        .body { display: flex; gap: 16px; flex: 1; overflow: hidden; min-height: 0; }

        /* ── Panel PDF ── */
        .pdf-panel {
            flex: 1; display: flex; flex-direction: column;
            background: white; border-radius: 10px; padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow: hidden;
            min-width: 380px;
        }
        body.dark-mode .pdf-panel { background: #2d2d2d; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
        .pdf-panel h3 { font-size: .9rem; color: #666; margin-bottom: 10px; }
        body.dark-mode .pdf-panel h3 { color: #aaa; }

        .zoom-bar {
            display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
        }
        .zoom-btn {
            width: 30px; height: 30px; border: none; cursor: pointer; border-radius: 6px;
            background: linear-gradient(135deg,#3b4245,#7d8282); color: white;
            font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center;
            transition: all .15s; flex-shrink: 0;
        }
        .zoom-btn:hover { background: linear-gradient(135deg,#2d3537,#6a6e6e); transform: translateY(-1px); }
        .zoom-label { min-width: 44px; text-align: center; font-size: .85rem; font-weight: 600; color: #555; }
        body.dark-mode .zoom-label { color: #ccc; }

        .pdf-scroll {
            flex: 1; overflow: auto; background: #f0f2f5; border-radius: 6px;
            cursor: grab; min-height: 0;
        }
        body.dark-mode .pdf-scroll { background: #1a1a1a; }
        .pdf-scroll:active { cursor: grabbing; }
        .pdf-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
        .pdf-scroll::-webkit-scrollbar-thumb { background: #aaa; border-radius: 3px; }
        #pdf-canvas { display: block; margin: 10px auto; box-shadow: 0 2px 8px rgba(0,0,0,.2); background: white; }

        /* ── Panel derecho ── */
        .right-panel {
            width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto;
        }

        .alert-box {
            background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
            padding: 9px 12px; font-size: .82rem; color: #856404; flex-shrink: 0;
        }
        body.dark-mode .alert-box { background: #3a3100; border-color: #8b7000; color: #ffd966; }

        .card {
            background: white; border-radius: 10px; padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.07); flex-shrink: 0;
        }
        body.dark-mode .card { background: #2d2d2d; box-shadow: 0 2px 8px rgba(0,0,0,.3); }

        .field-label {
            font-size: .78rem; font-weight: 700; color: #666; text-transform: uppercase;
            letter-spacing: .04em; margin-bottom: 6px;
        }
        body.dark-mode .field-label { color: #aaa; }

        select, input[type="text"] {
            width: 100%; padding: 9px 11px; border: 2px solid #ddd; border-radius: 8px;
            font-size: .92rem; background: white; color: #2c3e50; transition: border-color .2s;
            font-family: inherit;
        }
        body.dark-mode select, body.dark-mode input[type="text"] {
            background: #1a1a1a; border-color: #444; color: #e0e0e0;
        }
        select:focus, input[type="text"]:focus { outline: none; border-color: #3b82f6; }
        select.error, input.error { border-color: #ef4444 !important; background: rgba(239,68,68,.05) !important; }
        .error-msg { font-size: .75rem; color: #ef4444; margin-top: 4px; display: none; }
        .error-msg.show { display: block; }

        /* ── Parts builder form ── */
        .parts-form { display: flex; flex-direction: column; gap: 10px; }
        .parts-preview-row {
            display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
            padding: 8px 10px; background: #f8f9fa; border-radius: 8px;
            border: 1px dashed #ccc; min-height: 36px;
        }
        body.dark-mode .parts-preview-row { background: #222; border-color: #444; }
        .part-static {
            background: #e5e7eb; color: #374151; border-radius: 5px;
            padding: 3px 8px; font-size: .82rem; font-weight: 600;
        }
        body.dark-mode .part-static { background: #3a3a3a; color: #ccc; }
        .part-placeholder {
            background: #dbeafe; color: #1d4ed8; border-radius: 5px;
            padding: 3px 8px; font-size: .82rem; font-weight: 600;
            border: 1px dashed #93c5fd;
        }
        body.dark-mode .part-placeholder { background: #1e3a5f; color: #93c5fd; border-color: #3b82f6; }
        .parts-inputs { display: flex; flex-direction: column; gap: 8px; }
        .part-input-row { display: flex; flex-direction: column; gap: 3px; }
        .part-input-row label { font-size: .8rem; font-weight: 600; color: #555; }
        body.dark-mode .part-input-row label { color: #bbb; }

        /* ── Nombre simple (sin template) ── */
        .simple-hint { font-size: .78rem; color: #888; margin-top: 5px; }

        /* ── Tarjeta de sugerencia ── */
        body.dark-mode .card[style*="86efac"] {
            background: #0f2d1a !important; border-color: #16a34a !important;
        }
        body.dark-mode #suggestion-name-box {
            background: #1a1a1a !important; border-color: #166534 !important; color: #86efac !important;
        }

        /* ── Previews ── */
        .name-original {
            background: #eff6ff; border: 1.5px solid #93c5fd; border-radius: 8px;
            padding: 9px 12px; font-size: .85rem; text-align: center; flex-shrink: 0;
        }
        body.dark-mode .name-original { background: #1a2a3a; border-color: #1976d2; }
        .name-original strong { color: #1d4ed8; }
        body.dark-mode .name-original strong { color: #60a5fa; }
        #orig-name { color: #1e40af; font-weight: 600; word-break: break-all; }
        body.dark-mode #orig-name { color: #93c5fd; }

        .name-final {
            background: #f0fdf4; border: 2px solid #86efac; border-radius: 8px;
            padding: 10px 12px; font-size: .9rem; text-align: center; flex-shrink: 0;
        }
        body.dark-mode .name-final { background: #0f2d1a; border-color: #16a34a; }
        .name-final strong { color: #15803d; }
        body.dark-mode .name-final strong { color: #4ade80; }
        #final-name { color: #166534; font-weight: 700; word-break: break-all; }
        body.dark-mode #final-name { color: #86efac; }

        /* ── Botones ── */
        .actions { display: flex; gap: 10px; padding: 6px 0 2px; flex-shrink: 0; }
        .btn {
            flex: 1; padding: 11px 20px; border: none; border-radius: 25px;
            font-size: .95rem; font-weight: 700; cursor: pointer;
            transition: all .15s; box-shadow: 0 2px 8px rgba(0,0,0,.12);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,.2); }
        .btn:active { transform: scale(.97) translateY(1px); }
        .btn:disabled { opacity: .45; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
        .btn-skip { background: linear-gradient(135deg,#95a5a6,#7f8c8d); color: white; }
        .btn-confirm { background: linear-gradient(135deg,#3b4245,#7d8282); color: white; }
        .btn-confirm:hover { background: linear-gradient(135deg,#2d3537,#6a6e6e); }
        body.dark-mode .btn-confirm { background: linear-gradient(135deg,#2a2a2a,#7d7d7d); }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>✍️ Renombrado Manual</h2>
        <span id="queue-badge" class="queue-badge" style="display:none"></span>
    </div>

    <div class="body">
        <!-- PDF -->
        <div class="pdf-panel">
            <h3>Vista previa del documento</h3>
            <div class="zoom-bar">
                <button class="zoom-btn" id="btn-zoom-out">−</button>
                <span class="zoom-label" id="zoom-label">100%</span>
                <button class="zoom-btn" id="btn-zoom-in">+</button>
                <button class="zoom-btn" id="btn-zoom-reset" title="Restablecer">↻</button>
            </div>
            <div class="pdf-scroll" id="pdf-scroll">
                <canvas id="pdf-canvas"></canvas>
            </div>
        </div>

        <!-- Panel derecho -->
        <div class="right-panel" id="right-panel">
            <div id="alert-box" class="alert-box" style="display:none">
                ⚠️ No se pudo detectar el tipo automáticamente. Por favor, revisa e introduce los datos manualmente.
            </div>

            <!-- Selector de tipo -->
            <div class="card">
                <div class="field-label">Tipo de documento</div>
                <select id="sel-type">
                    <option value="">— Selecciona el tipo —</option>
                </select>
                <div class="error-msg" id="err-type">Selecciona el tipo de documento.</div>
            </div>

            <!-- Formulario dinámico (se rellena con JS) -->
            <div id="dyn-form"></div>

            <!-- Nombres -->
            <div class="name-original">
                <strong>Nombre original:</strong><br>
                <span id="orig-name">—</span>
            </div>
            <div class="name-final">
                <strong>Nombre final:</strong><br>
                <span id="final-name">—</span>
            </div>

            <!-- Acciones -->
            <div class="actions">
                <button class="btn btn-skip"    id="btn-skip">Omitir</button>
                <button class="btn btn-confirm" id="btn-confirm" disabled>Confirmar y Renombrar</button>
            </div>
        </div>
    </div>
</div>

<script src="manual-rename-window.js"></script>
</body>
</html>
